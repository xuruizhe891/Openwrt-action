name: System Info Probe

on:
  workflow_dispatch:

jobs:
  system-info:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect runner hardware information
        run: |
          echo "== uname =="
          uname -a
          echo "== OS release =="
          cat /etc/os-release
          echo "== CPU (lscpu) =="
          lscpu
          echo "== CPU count (nproc) =="
          nproc
          echo "== Memory (free -h) =="
          free -h
          echo "== Disk (df -h) =="
          df -h
          echo "== Block devices (lsblk) =="
          lsblk
          echo "== Top-level directories =="
          ls -la /
      - name: Check availability of build dependency packages
        run: |
          sudo apt-get -qq update
          for p in ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd; do
            cand=$(apt-cache policy "$p" | awk '/Candidate:/ {print $2}')
            echo "$p -> ${cand:-NOT_FOUND}"
          done
