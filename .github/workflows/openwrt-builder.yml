name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v10.x-修复某项);留空时用源码 git 短提交号'
        required: false
        default: ''
      ref:
        description: '私有源码仓库检出的分支或提交;留空时用默认分支'
        required: false
        default: ''

env:
  # 私有源码仓库坐标(建仓后把占位改为实际的 owner/仓库名)
  SOURCE_REPO: xuruizhe891/immortalwrt-mt798x-6.6-private
  SOURCE_REPO_REF: main
  FEEDS_CONF: feeds.conf.default
  # 构建配置来源:私有源码仓库内的设备构建配置(拷为 .config 后 make defconfig)
  CONFIG_FILE: configs/tl-7dr7230-v2.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Checkout private source repository
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPO }}
        ref: ${{ inputs.ref || github.event.client_payload.ref || env.SOURCE_REPO_REF }}
        token: ${{ secrets.SOURCE_REPO_TOKEN }}
        path: openwrt
        persist-credentials: false

    - name: Record disk space
      run: df -hT

    - name: Record source commit
      run: echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        BUILD_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
      run: |
        [ -e files ] && mv files openwrt/files
        cp openwrt/$CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        set -o pipefail
        echo -e "single thread compile (make -j1 V=s)"
        make -j1 V=s 2>&1 | tee /workdir/build.log
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload build logs
      uses: actions/upload-artifact@main
      if: (!cancelled())
      continue-on-error: true
      with:
        name: build-logs-${{ env.BUILD_VERSION_FINAL || github.run_number }}
        path: |
          /workdir/build.log
          openwrt/logs
        retention-days: 90

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        {
          echo "version: ${BUILD_VERSION_FINAL}"
          echo "commit: ${SOURCE_COMMIT}"
          echo "built_at: $(date +%FT%T%z)"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > version.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: firmware-${{ env.BUILD_VERSION_FINAL }}${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${BUILD_VERSION_FINAL}" >> $GITHUB_OUTPUT
        {
          echo "固件版本:${BUILD_VERSION_FINAL}"
          echo "源码提交:${SOURCE_COMMIT}"
          echo "构建记录:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 运行记录与 Release 不主动清理(用户裁决:Release 全部保留;运行记录靠平台 90 天保留期自然过期)
