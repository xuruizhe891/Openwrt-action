#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt using GitHub Actions
#
# 本项目改造(2026-10-31,基于 P3TERX Actions-OpenWrt 模板):
# 公开编译仓库,checkout 私有源码仓库构建 TL-7DR7230 v2 固件;
# 版本号经 workflow 输入注入,Release 全部保留,构建日志单独归档。
#
# Copyright (c) 2019-2024 P3TERX <https://p3terx.com>
#
# This is free software, licensed under the MIT License.
# See /LICENSE for more information.
#

name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v10.x-修复某项);留空时用源码 git 短提交号'
        required: false
        default: ''
      ref:
        description: '私有源码仓库检出的分支或提交;留空时用默认分支'
        required: false
        default: ''

env:
  # 私有源码仓库坐标(建仓后把占位改为实际的 owner/仓库名)
  SOURCE_REPO: xuruizhe891/immortalwrt-mt798x-6.6-private
  SOURCE_REPO_REF: main
  FEEDS_CONF: feeds.conf.default
  # 构建配置来源:私有源码仓库内的设备构建配置(拷为 .config 后 make defconfig)
  CONFIG_FILE: configs/tl-7dr7230-v2.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Checkout private source repository
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPO }}
        ref: ${{ inputs.ref || github.event.client_payload.ref || env.SOURCE_REPO_REF }}
        token: ${{ secrets.SOURCE_REPO_TOKEN }}
        path: openwrt
        persist-credentials: false

    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
          openwrt/build_dir
        key: openwrt-build-${{ github.run_number }}
        restore-keys: |
          openwrt-build-

    - name: Record disk space
      run: df -hT

    - name: Record source commit
      run: echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Verify feeds lock
      run: |
        # 层 1 声明一致性:feeds.conf.default 声明的锁定 commit 必须与实际拉到的一致(^commit 幂等,不符即配置或拉取事故,直接失败)
        # 无锁定声明的分支形态(历史基线锚定提交,早于 ECR-v10.0-034 的 feeds 固定)警告放行不计失败,有声明时维持严格比对
        fail=0
        for feed in packages luci routing telephony; do
          lock=$(grep "^src-git $feed " openwrt/feeds.conf.default | sed -n 's/.*\^\([0-9a-f]\{40\}\)$/\1/p')
          actual=$(git -C "openwrt/feeds/$feed" rev-parse HEAD)
          if [ -z "$lock" ]; then
            echo "WARN: $feed 无 ^commit 锁定声明,跳过校验 actual=$actual"
            continue
          fi
          if [ "$lock" != "$actual" ]; then
            echo "ERROR: $feed 锁定不符 declared=$lock actual=$actual"
            fail=1
          else
            echo "OK: $feed $actual"
          fi
        done
        exit $fail

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        BUILD_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
      run: |
        [ -e files ] && mv files openwrt/files
        cp openwrt/$CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        set -o pipefail
        echo -e "parallel compile (make -j4 V=s)"
        make -j4 V=s 2>&1 | tee /workdir/build.log
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Extract build errors
      if: failure()
      continue-on-error: true
      run: |
        grep -n -E "fatal error|undefined reference|Error [0-9]|Hunk.*FAILED|No rule to make target|error:" /workdir/build.log > /workdir/build-errors.txt || true
        wc -l /workdir/build-errors.txt

    - name: Collect symbol closure evidence
      if: (!cancelled())
      continue-on-error: true
      run: |
        # 目的: 把符号闭包的三处关节(导出端 Module.symvers / 收集端 symvers/<包名>.symvers / 注入端 KBUILD_EXTRA_SYMBOLS)
        # 以及编译宏与导入导出符号的最终事实, 落成六个文本文件, 随 build-logs artifact 归档.
        # 全部步骤容错, 任何一步失败都不阻塞后续步骤与上传.
        set +e
        W="$GITHUB_WORKSPACE/openwrt"
        B="$W/build_dir"
        OUT=/workdir
        LOG=/workdir/build.log

        # 1) 收集端: symvers 目录下每个 <包名>.symvers 的文件名, 字节数, 行数
        #    只取 */symvers/*.symvers, 排除各包 M= 目录下的 Module.symvers(那是导出端, 见下一段)
        {
          echo "# 收集端产物: 符号收集钩子汇总出的 <包名>.symvers"
          echo "# 格式: 行数<TAB>字节数<TAB>路径"
          echo "# 判读: 某包的 symvers 行数明显少于它子目录 Module.symvers 的行数时, 收集端读错了位置(见 mt_wifi_cmn 目录准则 7.5)"
          find "$B" -path '*/symvers/*.symvers' -type f 2>/dev/null | sort | while read -r f; do
            printf '%s\t%s\t%s\n' "$(wc -l < "$f" 2>/dev/null || echo 0)" "$(stat -c %s "$f" 2>/dev/null || echo 0)" "${f#$W/}"
          done
        } > "$OUT/symvers-index.txt" 2>/dev/null

        # 2) 导出端: 全部 Module.symvers 与 Module.symvers.tmp, 逐个全量输出(每份通常只有几十行)
        {
          echo "# 导出端产物: 每个 Kbuild M= 目录下的 Module.symvers 与合并中间件 Module.symvers.tmp"
          echo "# 判读: 第四列是导出形态(EXPORT_SYMBOL 或 EXPORT_SYMBOL_GPL), 决定下游闭源模块能否引用"
          find "$B" \( -name 'Module.symvers' -o -name 'Module.symvers.tmp' \) -type f 2>/dev/null | sort | while read -r f; do
            echo "=== ${f#$W/}  行数=$(wc -l < "$f" 2>/dev/null || echo 0)  字节=$(stat -c %s "$f" 2>/dev/null || echo 0)"
            cat "$f" 2>/dev/null
            echo
          done
        } > "$OUT/module-symvers-index.txt" 2>/dev/null

        # 3) 注入端: build.log 里每条 KBUILD_EXTRA_SYMBOLS= 的行号与内容, 加去重后的可见文件集合与首次出现行号
        python3 - "$LOG" > "$OUT/kbuild-extra-symbols.txt" 2>/dev/null <<'PYEOF'
        import re, sys
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8", errors="replace") as h:
            lines = h.readlines()
        pat = re.compile(r'KBUILD_EXTRA_SYMBOLS="(.*?)"')
        first = {}
        print("# 注入端: build.log 里每条 KBUILD_EXTRA_SYMBOLS 的展开值")
        print("# 判读: 一个包能解析哪些跨包符号, 由它编译时 symvers 目录下已存在的 .symvers 决定, 因此可见性随构建顺序增长")
        print()
        print("=== 出现顺序与行号 ===")
        for i, line in enumerate(lines, 1):
            m = pat.search(line)
            if not m:
                continue
            val = m.group(1)
            files = [x for x in val.split() if x]
            ctx = ""
            mc = re.search(r'M="(.*?)"', line)
            if mc:
                ctx = mc.group(1).split("/")[-1]
            print(f"行 {i}\t包={ctx or "(未识别)"}\t可见文件数={len(files)}")
            for f in files:
                print(f"    {f}")
                first.setdefault(f.split("/")[-1], i)
        print()
        print("=== 首次出现行号(按首次出现升序) ===")
        for name, i in sorted(first.items(), key=lambda kv: kv[1]):
            print(f"{i}\t{name}")
        PYEOF

        # 4) modpost 结果: 只取故障信号与每次 modpost 的行
        {
          echo "# modpost 结果: 无 undefined! 与 GPL-incompatible 命中即链接闭合且许可证合规"
          echo "=== MODPOST 行 ==="
          grep -n 'MODPOST' "$LOG" 2>/dev/null
          echo "=== undefined! ==="
          grep -n 'undefined!' "$LOG" 2>/dev/null
          echo "=== GPL-incompatible ==="
          grep -n 'GPL-incompatible' "$LOG" 2>/dev/null
          echo "=== KBUILD_MODPOST_WARN ==="
          grep -n 'KBUILD_MODPOST_WARN' "$LOG" 2>/dev/null
        } > "$OUT/modpost-results.txt" 2>/dev/null

        # 5) 编译宏: 五个 mtk 包构建树里每个 .o.cmd 的 -D 全集
        {
          echo "# 编译宏: 每个目标文件 .o.cmd 里的 -D 全集(去重排序)"
          echo "# 判读: 源码里 grep 到 #ifdef 不等于编译时该宏生效; .o.cmd 是最终裁判"
          for pkg in mt_wifi_cmn mt_wifi7 mt_hwifi warp pce; do
            for d in "$B"/target-*/linux-*/"$pkg"; do
              [ -d "$d" ] || continue
              echo "=== ${d#$W/}"
              find "$d" -name '*.o.cmd' -type f 2>/dev/null | sort | while read -r cmd; do
                echo "--- ${cmd#$d/}"
                grep -o '\-D[A-Za-z_0-9]*' "$cmd" 2>/dev/null | sort -u | tr '\n' ' '
                echo
              done
            done
          done
        } > "$OUT/obj-cmd-macros.txt" 2>/dev/null

        # 6) ko 的导入导出符号: 未剥离版与 ipkg/rootfs 剥离版各一份
        {
          echo "# ko 符号: 每个 ko 的文件大小, 导出符号数, 导出符号清单, 导入(未定义)符号清单"
          echo "# 判读: 未定义符号为 mt_ 前缀者应能在 symvers-index.txt 里找到对应 <包名>.symvers"
          for pkg in mt_wifi_cmn mt_wifi7 mt_hwifi warp pce; do
            for d in "$B"/target-*/linux-*/"$pkg"; do
              [ -d "$d" ] || continue
              find "$d" -name '*.ko' -type f 2>/dev/null | sort | while read -r ko; do
                echo "=== ${ko#$W/}  字节=$(stat -c %s "$ko" 2>/dev/null || echo 0)"
                echo "--- 导出符号数"
                nm --defined-only "$ko" 2>/dev/null | wc -l
                echo "--- 导出符号(全局 T/D/B/R 型)"
                nm --defined-only "$ko" 2>/dev/null | grep -E '^[0-9a-f]+ [TDBR] ' | awk '{print $3}' | sort
                echo "--- 未定义符号"
                nm -u "$ko" 2>/dev/null | awk '{print $2}' | sort -u
                echo
              done
            done
          done
        } > "$OUT/ko-symbols.txt" 2>/dev/null

        # 7) 索引文件自检: 行数与字节数打一行汇总, 便于在 Actions 页面直接看产物是否为空
        for f in symvers-index.txt module-symvers-index.txt kbuild-extra-symbols.txt modpost-results.txt obj-cmd-macros.txt ko-symbols.txt; do
          printf '%s: %s 行, %s 字节\n' "$f" "$(wc -l < "$OUT/$f" 2>/dev/null || echo 0)" "$(stat -c %s "$OUT/$f" 2>/dev/null || echo 0)"
        done

    - name: Generate build info
      if: (!cancelled())
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LOG=/workdir/build.log
        INFO=/workdir/build-info.txt
        {
          echo "version: ${BUILD_VERSION_FINAL}"
          echo "commit: ${SOURCE_COMMIT}"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "--- 补丁应用统计(build.log) ---"
          # 口径说明(patch 的实际打印行为,非推测):
          # 1) 每个补丁应用时打印 "Applying <路径> using <类型>:, 因此 patch_start 只匹配行首 Applying.
          # 2) patch 只在 hunk 有偏移或模糊匹配时才打印 "Hunk #N succeeded at ..."; 无偏移的 hunk 不打印任何成功行.
          #    因此下面 hunk_* 三项统计的是"带偏移或模糊的成功 hunk", 不是全部成功 hunk; 全部成功数无法从日志精确计数.
          # 3) 失败与反向只认行首形态, 避免补丁文件名里含 FAILED 字样造成的误统计(历史轮次曾因此把 0 报成 4).
          echo "patch_start: $(grep -c '^Applying ' "$LOG" || true)"
          echo "hunk_offset_or_fuzz_succeeded: $(grep -cE '^Hunk #[0-9]+ succeeded at' "$LOG" || true)"
          echo "hunk_offset: $(grep -cE '^Hunk #[0-9]+ succeeded at .*\(offset ' "$LOG" || true)"
          echo "hunk_fuzz: $(grep -cE '^Hunk #[0-9]+ succeeded at .* with fuzz' "$LOG" || true)"
          echo "hunk_failed: $(grep -cE '^Hunk #[0-9]+ FAILED' "$LOG" || true)"
          echo "patch_reversed: $(grep -cE '^[[:space:]]*Reversed' "$LOG" || true)"
          echo "--- 构建产物体积 ---"
        } > "$INFO"
        find openwrt/bin/targets -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.fip' \) -exec du -h {} \; >> "$INFO" 2>/dev/null || true
        # 层 2 上游待审:锁定 commit 对分支头,按 feed 分组输出 ahead 与涉及包目录(ahead 时才列出;files 在 compare API 有 300 截断,全量以 total_commits 为准)
        {
          echo "--- 上游待审(锁定 commit 对分支头,按 feed 分组) ---"
          python3 - <<'PYEOF'
        import json, subprocess, re
        # feed 源坐标:feeds.conf.default 固定为 ^commit 后,对照分支信息在本表维护(改 feed 源或分支时同步此表)
        FEEDS = {
            "packages": ("immortalwrt/packages", "openwrt-24.10"),
            "luci": ("immortalwrt/luci", "openwrt-24.10"),
            "routing": ("openwrt/routing", "openwrt-24.10"),
            "telephony": ("openwrt/telephony", "openwrt-24.10"),
        }
        conf = open("openwrt/feeds.conf.default").read()
        for feed, (repo, branch) in FEEDS.items():
            m = re.search(rf"^src-git {feed} \S+\^([0-9a-f]{{40}})$", conf, re.M)
            if not m:
                print(f"[{feed}] feeds.conf 未找到锁定 commit,检查源表与配置")
                continue
            lock = m.group(1)
            r = subprocess.run(["gh", "api", f"repos/{repo}/compare/{lock}...{branch}"], capture_output=True, text=True)
            if r.returncode:
                print(f"[{feed}] compare 失败: {r.stderr.strip()[:120]}")
                continue
            d = json.loads(r.stdout)
            ahead = d.get("ahead_by", 0)
            total = d.get("total_commits", 0)
            if ahead == 0:
                print(f"[{feed}] ahead=0(与分支头一致)")
                continue
            pkgs = set()
            for f in d.get("files", []):
                mm = re.match(r"^([^/]+/[^/]+)/", f.get("filename", ""))
                if mm:
                    pkgs.add(mm.group(1))
            trunc = " (files 列表可能被 compare API 截断,以 total_commits 为准)" if len(d.get("files", [])) >= 300 else ""
            print(f"[{feed}] ahead={ahead} total_commits={total},涉及包目录 {len(pkgs)} 个:")
            print("  " + " ".join(sorted(pkgs)) + trunc)
        PYEOF
        } >> "$INFO" || true
        wc -l "$INFO"

    - name: Upload build logs
      uses: actions/upload-artifact@main
      if: (!cancelled())
      continue-on-error: true
      with:
        name: build-logs-${{ env.BUILD_VERSION_FINAL || github.run_number }}
        path: |
          /workdir/build.log
          /workdir/build-errors.txt
          /workdir/build-info.txt
          /workdir/symvers-index.txt
          /workdir/module-symvers-index.txt
          /workdir/kbuild-extra-symbols.txt
          /workdir/modpost-results.txt
          /workdir/obj-cmd-macros.txt
          /workdir/ko-symbols.txt
          openwrt/logs
        retention-days: 90

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Upload package artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      with:
        name: packages-${{ env.BUILD_VERSION_FINAL }}
        path: |
          openwrt/bin/packages
          openwrt/bin/targets/*/*/packages
        retention-days: 90

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        if [ -d packages ]; then
          tar -cf - packages | zstd -T0 -o packages.tar.zst
          rm -rf packages
        fi
        # 1. 归档本设备专属独立 DTB (TL-7DR7230 v2 专属,供 DTS 反编译核对;避免使用 *.dtb 通配符误拷入 50+ 无关移动芯片 dtb)
        cp "$GITHUB_WORKSPACE"/openwrt/build_dir/target-*/linux-*/image-mt7988d-tplink-tl-7dr7230-v2.dtb ./mt7988d-tplink-tl-7dr7230-v2.dtb 2>/dev/null || true

        # 2. 分卷打包目标架构编译目录 (包含打完所有补丁的内核完整 C 源码、MTK 私有驱动源码、全套 .o/.ko 目标文件与 .o.cmd 宏定义记录)
        # 机制: 单卷 1500M(1.5GB) 避开 GitHub Release 单文件 2048M(2GB) 上限; 管道直出压缩与切片, 零中间未压缩磁盘冗余
        echo "--- 开始分卷打包 target-aarch64 编译目录 ---"
        tar -cf - -C "$GITHUB_WORKSPACE"/openwrt/build_dir target-aarch64_generic+cortex-a73_musl \
          | zstd -T0 -3 \
          | split -b 1500M -d - target-build-dir.tar.zst.part
        echo "--- target-aarch64 分卷打包完成, 生成分卷清单: ---"
        ls -lh target-build-dir.tar.zst.part* || true

        # 3. 分卷打包 host/hostpkg/toolchain 三个编译目录 (宿主机与交叉工具链侧,含 hostpkg 装出的全部 host 工具)
        echo "--- 开始分卷打包 host 侧编译目录 ---"
        HOST_SRCS=""
        for d in host hostpkg; do
          [ -d "$GITHUB_WORKSPACE/openwrt/build_dir/$d" ] && HOST_SRCS="$HOST_SRCS $d"
        done
        for d in "$GITHUB_WORKSPACE"/openwrt/build_dir/toolchain-*; do
          [ -d "$d" ] && HOST_SRCS="$HOST_SRCS $(basename "$d")"
        done
        if [ -n "$HOST_SRCS" ]; then
          tar -cf - -C "$GITHUB_WORKSPACE"/openwrt/build_dir $HOST_SRCS \
            | zstd -T0 -3 \
            | split -b 1500M -d - host-build-dir.tar.zst.part
          ls -lh host-build-dir.tar.zst.part* || true
        else
          echo "host 侧编译目录不存在,跳过"
        fi

        # 4. 分卷打包 staging_dir 全部顶层目录 (含 pkginfo 下的 *.install 文件清单与 stamp 目录,二者是"包是否装进 rootfs"的直接证据)
        echo "--- 开始分卷打包 staging_dir ---"
        STAGE_SRCS=""
        for d in "$GITHUB_WORKSPACE"/openwrt/staging_dir/*; do
          [ -d "$d" ] && STAGE_SRCS="$STAGE_SRCS $(basename "$d")"
        done
        if [ -n "$STAGE_SRCS" ]; then
          tar -cf - -C "$GITHUB_WORKSPACE"/openwrt/staging_dir $STAGE_SRCS \
            | zstd -T0 -3 \
            | split -b 1500M -d - staging-dir.tar.zst.part
          ls -lh staging-dir.tar.zst.part* || true
        else
          echo "staging_dir 不存在,跳过"
        fi

        cp /workdir/build-info.txt . 2>/dev/null || true
        {
          echo "version: ${BUILD_VERSION_FINAL}"
          echo "commit: ${SOURCE_COMMIT}"
          echo "built_at: $(date +%FT%T%z)"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > version.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: firmware-${{ env.BUILD_VERSION_FINAL }}${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=${BUILD_VERSION_FINAL}" >> $GITHUB_OUTPUT
        {
          echo "固件版本:${BUILD_VERSION_FINAL}"
          echo "源码提交:${SOURCE_COMMIT}"
          echo "构建记录:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo ""
          echo "--- 编译现场分卷还原说明 ---"
          echo "本地合并解包命令: cat target-build-dir.tar.zst.part* | zstd -d | tar -xf -"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 运行记录与 Release 不主动清理(用户裁决:Release 全部保留;运行记录靠平台 90 天保留期自然过期)
