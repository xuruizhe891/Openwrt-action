#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt using GitHub Actions
#
# 本项目改造(2026-10-31,基于 P3TERX Actions-OpenWrt 模板):
# 公开编译仓库,checkout 私有源码仓库构建 TL-7DR7230 v2 固件;
# 版本号经 workflow 输入注入,Release 全部保留,构建日志单独归档。
#
# Copyright (c) 2019-2024 P3TERX <https://p3terx.com>
#
# This is free software, licensed under the MIT License.
# See /LICENSE for more information.
#

name: OpenWrt Builder

run-name: ${{ inputs.label || inputs.version || format('run-{0}', github.run_number) }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v10.8.0);留空时用源码 git 短提交号. 该值同时是 Release tag 与产物文件名前缀'
        required: false
        default: ''
      label:
        description: '运行列表里显示的名称(如 20261109-v10.8.0);留空时退回 version 或 run 序号. 只影响显示, 不参与产物命名'
        required: false
        default: ''
      ref:
        description: '私有源码仓库检出的分支或提交;留空时用默认分支'
        required: false
        default: ''

env:
  # 私有源码仓库坐标
  SOURCE_REPO: xuruizhe891/immortalwrt-mt798x-6.6-private
  SOURCE_REPO_REF: main
  FEEDS_CONF: feeds.conf.default
  # 构建配置来源: 私有源码仓库内的设备构建配置(拷为 .config 后 make defconfig)
  CONFIG_FILE: configs/tl-7dr7230-v2.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # Release 说明文件: 打包成 Release 资产, 同时是 Release 正文
  RELEASE_NOTES: release-notes.md
  # 是否把发版说明回写到私有源码仓库的 tmp/固件及编译日志/<版本号>/release-notes.md.
  # 开启后, 发版结论在源码仓一处可查(与本地保存的日志目录同名同结构).
  # 写入目标是本次检出的分支(SOURCE_REF), 不是 main, 因此不会改动 main 的线性历史.
  UPLOAD_RELEASE_NOTES_TO_SOURCE: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Checkout private source repository
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPO }}
        ref: ${{ inputs.ref || github.event.client_payload.ref || env.SOURCE_REPO_REF }}
        token: ${{ secrets.SOURCE_REPO_TOKEN }}
        path: openwrt
        persist-credentials: false

    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
          openwrt/build_dir
        key: openwrt-build-${{ github.run_number }}
        restore-keys: |
          openwrt-build-

    - name: Record disk space
      run: df -hT

    - name: Record source commit
      env:
        INPUT_REF: ${{ inputs.ref || github.event.client_payload.ref || env.SOURCE_REPO_REF }}
        INPUT_LABEL: ${{ inputs.label || '' }}
        INPUT_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
      run: |
        echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV
        echo "SOURCE_REF=${INPUT_REF}" >> $GITHUB_ENV
        echo "SOURCE_SHORT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
        # 运行显示名: 优先用 label 输入; 其次用 version; 都没有时留空, run-name 已回退到 run 序号
        if [ -n "${INPUT_LABEL}" ]; then
          echo "RUN_LABEL=${INPUT_LABEL}" >> $GITHUB_ENV
        elif [ -n "${INPUT_VERSION}" ]; then
          echo "RUN_LABEL=${INPUT_VERSION}" >> $GITHUB_ENV
        else
          echo "RUN_LABEL=" >> $GITHUB_ENV
        fi
        echo "检出版本: commit=$SOURCE_SHORT ref=${INPUT_REF} label=${INPUT_LABEL:-${INPUT_VERSION:-无}}"

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Verify feeds lock
      run: |
        # 声明一致性校验:feeds.conf.default 声明的固定 commit 必须与实际拉到的一致
        #   (^commit 形式可重复校验;不符即配置或拉取事故,直接失败)
        # 无固定声明时(历史基线的固定提交,早于 ECR-v10.0-034 的 feeds 固定)打印警告并跳过该 feed,不计失败;
        #   有声明时维持严格比对
        fail=0
        for feed in packages luci routing telephony; do
          lock=$(grep "^src-git $feed " openwrt/feeds.conf.default | sed -n 's/.*\^\([0-9a-f]\{40\}\)$/\1/p')
          actual=$(git -C "openwrt/feeds/$feed" rev-parse HEAD)
          if [ -z "$lock" ]; then
            echo "WARN: $feed 无 ^commit 固定声明,跳过校验 actual=$actual"
            continue
          fi
          if [ "$lock" != "$actual" ]; then
            echo "ERROR: $feed 固定 commit 与实际不符 declared=$lock actual=$actual"
            fail=1
          else
            echo "OK: $feed $actual"
          fi
        done
        exit $fail

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        BUILD_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
      run: |
        [ -e files ] && mv files openwrt/files
        cp openwrt/$CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        set -o pipefail
        echo -e "parallel compile (make -j4 V=s)"
        make -j4 V=s 2>&1 | tee /workdir/build.log
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Extract build errors
      if: failure()
      continue-on-error: true
      run: |
        grep -n -E "fatal error|undefined reference|Error [0-9]|Hunk.*FAILED|No rule to make target|error:" /workdir/build.log > /workdir/build-errors.txt || true
        wc -l /workdir/build-errors.txt

    - name: Collect symbol closure evidence
      if: (!cancelled())
      continue-on-error: true
      run: |
        # 目的: 把符号传递关系上的三个位置记成文本证据
        #   (导出端: 各 Kbuild M= 目录的 Module.symvers / 收集端: symvers/<包名>.symvers / 注入端: KBUILD_EXTRA_SYMBOLS)
        # 以及编译宏与导入导出符号的事实, 写成六个文本文件, 随 build-logs artifact 归档.
        # 全部步骤容错, 任何一步失败都不阻塞后续步骤与上传.
        set +e
        W="$GITHUB_WORKSPACE/openwrt"
        B="$W/build_dir"
        OUT=/workdir
        LOG=/workdir/build.log

        # 1) 收集端: symvers 目录下每个 <包名>.symvers 的文件名, 字节数, 行数
        #    只取 */symvers/*.symvers, 排除各包 M= 目录下的 Module.symvers(那是导出端, 见下一段)
        {
          echo "# 收集端产物: 符号收集钩子汇总出的 <包名>.symvers"
          echo "# 格式: 行数<TAB>字节数<TAB>路径"
          echo "# 如何读: 某包的 symvers 行数明显少于它子目录 Module.symvers 的行数时, 收集端读错了位置(见 mt_wifi_cmn 目录准则 7.5)"
          find "$B" -path '*/symvers/*.symvers' -type f 2>/dev/null | sort | while read -r f; do
            printf '%s\t%s\t%s\n' "$(wc -l < "$f" 2>/dev/null || echo 0)" "$(stat -c %s "$f" 2>/dev/null || echo 0)" "${f#$W/}"
          done
        } > "$OUT/symvers-index.txt" 2>/dev/null

        # 2) 导出端: 全部 Module.symvers 与 Module.symvers.tmp, 逐个全量输出(每份通常只有几十行)
        {
          echo "# 导出端产物: 每个 Kbuild M= 目录下的 Module.symvers 与合并中间件 Module.symvers.tmp"
          echo "# 如何读: 第四列是导出形态(EXPORT_SYMBOL 或 EXPORT_SYMBOL_GPL), 决定下游闭源模块能否引用"
          find "$B" \( -name 'Module.symvers' -o -name 'Module.symvers.tmp' \) -type f 2>/dev/null | sort | while read -r f; do
            echo "=== ${f#$W/}  行数=$(wc -l < "$f" 2>/dev/null || echo 0)  字节=$(stat -c %s "$f" 2>/dev/null || echo 0)"
            cat "$f" 2>/dev/null
            echo
          done
        } > "$OUT/module-symvers-index.txt" 2>/dev/null

        # 3) 注入端: build.log 里每条 KBUILD_EXTRA_SYMBOLS= 的行号与内容, 加去重后的可见文件集合与首次出现行号
        python3 - "$LOG" > "$OUT/kbuild-extra-symbols.txt" 2>/dev/null <<'PYEOF'
        import re, sys
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8", errors="replace") as h:
            lines = h.readlines()
        pat = re.compile(r'KBUILD_EXTRA_SYMBOLS="(.*?)"')
        first = {}
        print("# 注入端: build.log 里每条 KBUILD_EXTRA_SYMBOLS 的展开值")
        print("# 如何读: 一个包能解析哪些跨包符号, 由它编译时 symvers 目录下已存在的 .symvers 决定, 因此可见性随构建顺序增长")
        print()
        print("=== 出现顺序与行号 ===")
        for i, line in enumerate(lines, 1):
            m = pat.search(line)
            if not m:
                continue
            val = m.group(1)
            files = [x for x in val.split() if x]
            ctx = ""
            mc = re.search(r'M="(.*?)"', line)
            if mc:
                ctx = mc.group(1).split("/")[-1]
            print(f"行 {i}\t包={ctx or "(未识别)"}\t可见文件数={len(files)}")
            for f in files:
                print(f"    {f}")
                first.setdefault(f.split("/")[-1], i)
        print()
        print("=== 首次出现行号(按首次出现升序) ===")
        for name, i in sorted(first.items(), key=lambda kv: kv[1]):
            print(f"{i}\t{name}")
        PYEOF

        # 4) modpost 结果: 只取故障信号与每次 modpost 的行
        {
          echo "# modpost 结果: undefined! 与 GPL-incompatible 命中数为 0 表示链接完整且许可证合规"
          echo "=== MODPOST 行 ==="
          grep -n 'MODPOST' "$LOG" 2>/dev/null
          echo "=== undefined! ==="
          grep -n 'undefined!' "$LOG" 2>/dev/null
          echo "=== GPL-incompatible ==="
          grep -n 'GPL-incompatible' "$LOG" 2>/dev/null
          echo "=== KBUILD_MODPOST_WARN ==="
          grep -n 'KBUILD_MODPOST_WARN' "$LOG" 2>/dev/null
        } > "$OUT/modpost-results.txt" 2>/dev/null

        # 5) 编译宏: 五个 mtk 包构建树里每个 .o.cmd 的 -D 全集
        {
          echo "# 编译宏: 每个目标文件 .o.cmd 里的 -D 全集(去重排序)"
          echo "# 如何读: 源码里 grep 到 #ifdef 不等于编译时该宏生效; .o.cmd 是最终判定依据"
          for pkg in mt_wifi_cmn mt_wifi7 mt_hwifi warp pce; do
            for d in "$B"/target-*/linux-*/"$pkg"; do
              [ -d "$d" ] || continue
              echo "=== ${d#$W/}"
              find "$d" -name '*.o.cmd' -type f 2>/dev/null | sort | while read -r cmd; do
                echo "--- ${cmd#$d/}"
                grep -o '\-D[A-Za-z_0-9]*' "$cmd" 2>/dev/null | sort -u | tr '\n' ' '
                echo
              done
            done
          done
        } > "$OUT/obj-cmd-macros.txt" 2>/dev/null

        # 6) ko 的导入导出符号: 未剥离版与 ipkg/rootfs 剥离版各一份
        {
          echo "# ko 符号: 每个 ko 的文件大小, 导出符号数, 导出符号清单, 导入(未定义)符号清单"
          echo "# 如何读: 未定义符号为 mt_ 前缀者应能在 symvers-index.txt 里找到对应 <包名>.symvers"
          for pkg in mt_wifi_cmn mt_wifi7 mt_hwifi warp pce; do
            for d in "$B"/target-*/linux-*/"$pkg"; do
              [ -d "$d" ] || continue
              find "$d" -name '*.ko' -type f 2>/dev/null | sort | while read -r ko; do
                echo "=== ${ko#$W/}  字节=$(stat -c %s "$ko" 2>/dev/null || echo 0)"
                echo "--- 导出符号数"
                nm --defined-only "$ko" 2>/dev/null | wc -l
                echo "--- 导出符号(全局 T/D/B/R 型)"
                nm --defined-only "$ko" 2>/dev/null | grep -E '^[0-9a-f]+ [TDBR] ' | awk '{print $3}' | sort
                echo "--- 未定义符号"
                nm -u "$ko" 2>/dev/null | awk '{print $2}' | sort -u
                echo
              done
            done
          done
        } > "$OUT/ko-symbols.txt" 2>/dev/null

        # 7) 索引文件自检: 行数与字节数打一行汇总, 便于在 Actions 页面直接看产物是否为空
        for f in symvers-index.txt module-symvers-index.txt kbuild-extra-symbols.txt modpost-results.txt obj-cmd-macros.txt ko-symbols.txt; do
          printf '%s: %s 行, %s 字节\n' "$f" "$(wc -l < "$OUT/$f" 2>/dev/null || echo 0)" "$(stat -c %s "$OUT/$f" 2>/dev/null || echo 0)"
        done

        # 8) wlan_hwifi 编译入口合并检查(ECR-v10-046 的验证判据)
        #    判据一: build_dir 下只应有 mt_wifi7 一个包构建目录, 不应再有 mt_hwifi 目录
        #    判据二: mt_wifi7 的构建树里两个 Kbuild 入口都应有产物
        #            (mt_wifi_ap/mt_wifi.ko 与 wlan_hwifi 下的 mtk_hwifi.ko / mtk_pci.ko 等)
        #    判据三: symvers/mt_wifi7.symvers 的导出条数应不少于两个入口目录 Module.symvers 的去重并集条数
        #    判据四: build.log 里不应出现 undefined! 与 GPL-incompatible
        #    全部为容错统计, 结论写在文件里的 PASS 或 FAIL 行, 不阻塞上传.
        {
          echo "# wlan_hwifi 编译入口合并检查(ECR-v10-046)"
          echo "# 判据: 单包单构建目录, 两个 Kbuild 入口均有产物, symvers 收集完整, modpost 无故障"
          echo

          echo "=== 判据一: build_dir 下的 mtk 包构建目录 ==="
          # 用 find 逐个列目录, 不用 glob 直接进 test, 避免匹配多个时 test 收到多余参数
          hwifi_dirs=$(find "$B" -maxdepth 3 -type d -path '*/linux-*/mt_hwifi' 2>/dev/null)
          wifi7_dirs=$(find "$B" -maxdepth 3 -type d -path '*/linux-*/mt_wifi7' 2>/dev/null)
          echo "mt_hwifi 构建目录:"
          if [ -n "$hwifi_dirs" ]; then
            printf '  存在\t%s\n' $hwifi_dirs
          else
            echo "  无"
          fi
          echo "mt_wifi7 构建目录:"
          if [ -n "$wifi7_dirs" ]; then
            printf '  存在\t%s\n' $wifi7_dirs
          else
            echo "  无"
          fi
          if [ -n "$hwifi_dirs" ]; then
            echo "FAIL: 仍存在 mt_hwifi 构建目录, 说明 mt_hwifi/Makefile 仍被包扫描执行"
          else
            echo "PASS: 只有 mt_wifi7 一个包构建目录"
          fi
          echo

          echo "=== 判据二: mt_wifi7 构建树里两个 Kbuild 入口的产物 ==="
          for d in $wifi7_dirs; do
            echo "构建目录: ${d#$W/}"
            for f in mt_wifi_ap/mt_wifi.ko wlan_hwifi/mtk_hwifi.ko wlan_hwifi/mtk_pci.ko wlan_hwifi/mtk_wed.ko wlan_hwifi/connac_if.ko wlan_hwifi/mt7992.ko; do
              if [ -f "$d/$f" ]; then
                echo "  存在  $f  字节=$(stat -c %s "$d/$f" 2>/dev/null || echo 0)"
              else
                echo "  不存在  $f"
              fi
            done
          done
          echo

          echo "=== 判据三: symvers 收集完整度 ==="
          for d in $wifi7_dirs; do
            ap_sv="$d/mt_wifi_ap/Module.symvers"
            hw_sv="$d/wlan_hwifi/Module.symvers"
            ap_lines=0
            hw_lines=0
            [ -f "$ap_sv" ] && ap_lines=$(wc -l < "$ap_sv")
            [ -f "$hw_sv" ] && hw_lines=$(wc -l < "$hw_sv")
            echo "mt_wifi_ap/Module.symvers 行数 = ${ap_lines}"
            echo "wlan_hwifi/Module.symvers 行数 = ${hw_lines}"
            if [ -f "$ap_sv" ] && [ -f "$hw_sv" ]; then
              union_lines=$(cat "$ap_sv" "$hw_sv" | awk -F'\t' '{print $2}' | sort -u | wc -l)
              echo "两入口的导出符号去重并集条数 = ${union_lines}"
            else
              union_lines=""
              echo "FAIL: 至少一个入口目录缺 Module.symvers"
            fi
            pkg_sv="$(dirname "$d")/symvers/mt_wifi7.symvers"
            if [ -f "$pkg_sv" ]; then
              sv_lines=$(wc -l < "$pkg_sv")
              echo "symvers/mt_wifi7.symvers 行数 = ${sv_lines}"
              if [ -n "$union_lines" ]; then
                if [ "$sv_lines" -ge "$union_lines" ]; then
                  echo "PASS: 收集端行数不少于两入口并集"
                else
                  echo "FAIL: 收集端行数少于两入口并集, 检查 PKG_EXTMOD_SUBDIRS 与实际 Module.symvers 位置"
                fi
              fi
            else
              echo "FAIL: 缺少 $(dirname "$d")/symvers/mt_wifi7.symvers, 收集钩子未产出或读错位置"
            fi
          done
          echo

          echo "=== 判据四: modpost 故障信号 ==="
          undef=$(grep -c 'undefined!' "$LOG" 2>/dev/null)
          gplin=$(grep -c 'GPL-incompatible' "$LOG" 2>/dev/null)
          echo "undefined! 命中行数 = ${undef:-0}"
          echo "GPL-incompatible 命中行数 = ${gplin:-0}"
          if [ "${undef:-0}" -eq 0 ] && [ "${gplin:-0}" -eq 0 ]; then
            echo "PASS: modpost 无故障信号"
          else
            echo "FAIL: modpost 存在故障信号, 见 modpost-results.txt"
          fi
        } > "$OUT/mt-wifi7-migration-check.txt" 2>/dev/null
        printf '%s: %s 行, %s 字节\n' mt-wifi7-migration-check.txt \
          "$(wc -l < "$OUT/mt-wifi7-migration-check.txt" 2>/dev/null || echo 0)" \
          "$(stat -c %s "$OUT/mt-wifi7-migration-check.txt" 2>/dev/null || echo 0)"

    - name: Generate build info
      if: (!cancelled())
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LOG=/workdir/build.log
        INFO=/workdir/build-info.txt
        {
          echo "version: ${BUILD_VERSION_FINAL}"
          echo "commit: ${SOURCE_COMMIT}"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "--- 补丁应用统计(build.log) ---"
          # 统计方式说明(patch 的实际打印行为,非推测):
          # 1) 每个补丁应用时打印 "Applying <路径> using <类型>:"，因此 patch_start 只匹配行首 Applying.
          # 2) patch 只在 hunk 有偏移或模糊匹配时才打印 "Hunk #N succeeded at ..."; 无偏移的 hunk 不打印任何成功行.
          #    因此下面 hunk_* 三项统计的是"带偏移或模糊的成功 hunk", 不是全部成功 hunk; 全部成功数无法从日志精确计数.
          # 3) 失败与反向只认行首形态, 避免补丁文件名里含 FAILED 字样造成的误统计(历史轮次曾因此把 0 报成 4).
          echo "patch_start: $(grep -c '^Applying ' "$LOG" || true)"
          echo "hunk_offset_or_fuzz_succeeded: $(grep -cE '^Hunk #[0-9]+ succeeded at' "$LOG" || true)"
          echo "hunk_offset: $(grep -cE '^Hunk #[0-9]+ succeeded at .*\(offset ' "$LOG" || true)"
          echo "hunk_fuzz: $(grep -cE '^Hunk #[0-9]+ succeeded at .* with fuzz' "$LOG" || true)"
          echo "hunk_failed: $(grep -cE '^Hunk #[0-9]+ FAILED' "$LOG" || true)"
          echo "patch_reversed: $(grep -cE '^[[:space:]]*Reversed' "$LOG" || true)"
          echo "--- 构建产物体积 ---"
        } > "$INFO"
        find openwrt/bin/targets -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.fip' \) -exec du -h {} \; >> "$INFO" 2>/dev/null || true
        # 上游待审:固定 commit 与对应分支头比对,按 feed 分组输出 ahead 与涉及包目录
        #   (ahead 时才列出;compare API 的 files 列表上限 300 条,全量以 total_commits 为准)
        {
          echo "--- 上游待审(固定 commit 与分支头比对,按 feed 分组) ---"
          python3 - <<'PYEOF'
        import json, subprocess, re
        # feed 源坐标:feeds.conf.default 固定为 ^commit 后,对照分支信息在本表维护(改 feed 源或分支时同步此表)
        FEEDS = {
            "packages": ("immortalwrt/packages", "openwrt-24.10"),
            "luci": ("immortalwrt/luci", "openwrt-24.10"),
            "routing": ("openwrt/routing", "openwrt-24.10"),
            "telephony": ("openwrt/telephony", "openwrt-24.10"),
        }
        conf = open("openwrt/feeds.conf.default").read()
        for feed, (repo, branch) in FEEDS.items():
            m = re.search(rf"^src-git {feed} \S+\^([0-9a-f]{{40}})$", conf, re.M)
            if not m:
                print(f"[{feed}] feeds.conf 未找到固定 commit,检查源表与配置")
                continue
            pinned = m.group(1)
            r = subprocess.run(["gh", "api", f"repos/{repo}/compare/{pinned}...{branch}"], capture_output=True, text=True)
            if r.returncode:
                print(f"[{feed}] compare 失败: {r.stderr.strip()[:120]}")
                continue
            d = json.loads(r.stdout)
            ahead = d.get("ahead_by", 0)
            total = d.get("total_commits", 0)
            if ahead == 0:
                print(f"[{feed}] ahead=0(与分支头一致)")
                continue
            pkgs = set()
            for f in d.get("files", []):
                mm = re.match(r"^([^/]+/[^/]+)/", f.get("filename", ""))
                if mm:
                    pkgs.add(mm.group(1))
            trunc = " (files 列表可能被 compare API 截断,以 total_commits 为准)" if len(d.get("files", [])) >= 300 else ""
            print(f"[{feed}] ahead={ahead} total_commits={total},涉及包目录 {len(pkgs)} 个:")
            print("  " + " ".join(sorted(pkgs)) + trunc)
        PYEOF
        } >> "$INFO" || true
        wc -l "$INFO"

    - name: Upload build logs
      uses: actions/upload-artifact@main
      if: (!cancelled())
      continue-on-error: true
      with:
        name: build-logs-${{ env.BUILD_VERSION_FINAL || github.run_number }}
        path: |
          /workdir/build.log
          /workdir/build-errors.txt
          /workdir/build-info.txt
          /workdir/symvers-index.txt
          /workdir/module-symvers-index.txt
          /workdir/kbuild-extra-symbols.txt
          /workdir/modpost-results.txt
          /workdir/obj-cmd-macros.txt
          /workdir/ko-symbols.txt
          /workdir/mt-wifi7-migration-check.txt
          openwrt/logs
        retention-days: 90

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Upload package artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      with:
        name: packages-${{ env.BUILD_VERSION_FINAL }}
        path: |
          openwrt/bin/packages
          openwrt/bin/targets/*/*/packages
        retention-days: 90

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        if [ -d packages ]; then
          tar -cf - packages | zstd -T0 -o packages.tar.zst
          rm -rf packages
        fi
        # 1. 归档本设备专属独立 DTB (TL-7DR7230 v2 专属,供 DTS 反编译核对;避免使用 *.dtb 通配符误拷入 50+ 无关移动芯片 dtb)
        cp "$GITHUB_WORKSPACE"/openwrt/build_dir/target-*/linux-*/image-mt7988d-tplink-tl-7dr7230-v2.dtb ./mt7988d-tplink-tl-7dr7230-v2.dtb 2>/dev/null || true

        # 2. 分卷打包编译现场 (build_dir 的目标架构目录 + host 侧目录 + staging_dir 全部顶层目录,
        #    合成为一个 tar 流再按 1500M 切片, 一个卷序列对应一次完整还原)
        #    单卷 1500M(1.5GB) 是为了避开 GitHub Release 单文件 2048M(2GB) 上限;
        #    管道直出压缩与切片, 不落中间未压缩副本.
        echo "--- 开始分卷打包编译现场 ---"
        SRCS=""
        for d in target-aarch64_generic+cortex-a73_musl host hostpkg; do
          [ -d "$GITHUB_WORKSPACE/openwrt/build_dir/$d" ] && SRCS="$SRCS build_dir/$d"
        done
        for d in "$GITHUB_WORKSPACE"/openwrt/build_dir/toolchain-*; do
          [ -d "$d" ] && SRCS="$SRCS build_dir/$(basename "$d")"
        done
        for d in "$GITHUB_WORKSPACE"/openwrt/staging_dir/*; do
          [ -d "$d" ] && SRCS="$SRCS staging_dir/$(basename "$d")"
        done
        if [ -n "$SRCS" ]; then
          tar -cf - -C "$GITHUB_WORKSPACE/openwrt" $SRCS \
            | zstd -T0 -3 \
            | split -b 1500M -d - build-dir.tar.zst.part
          echo "--- 编译现场分卷打包完成, 分卷清单: ---"
          ls -lh build-dir.tar.zst.part* || true
        else
          echo "编译现场目录一个都不存在, 跳过"
        fi

        # 3. 把其余产物打成一个归档, 便于整包下载; 固件 itb 等单文件仍在 Release 里单独保留, 刷机不需要解包
        echo "--- 开始打包其余产物 ---"
        BUNDLE="firmware-bundle.tar.zst"
        BUNDLE_SRCS=""
        for f in *.itb *.fip *.bin *.manifest sha256sums profiles.json packages.tar.zst build-info.txt version.txt; do
          [ -e "$f" ] && BUNDLE_SRCS="$BUNDLE_SRCS $f"
        done
        if [ -n "$BUNDLE_SRCS" ]; then
          tar -cf - $BUNDLE_SRCS | zstd -T0 -o "$BUNDLE"
          ls -lh "$BUNDLE" || true
        else
          echo "没有可打包的其余产物, 跳过"
        fi

        cp /workdir/build-info.txt . 2>/dev/null || true
        {
          echo "version: ${BUILD_VERSION_FINAL}"
          echo "commit: ${SOURCE_COMMIT}"
          echo "built_at: $(date +%FT%T%z)"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > version.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: firmware-${{ env.BUILD_VERSION_FINAL }}${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release notes
      id: notes
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        # 发版说明写成一个文件, 三个去向:
        #   1) Release 资产(随固件一起下载, 见 Upload firmware to release 的 files 列表)
        #   2) Release 正文(body_path)
        #   3) 私有源码仓库的 tmp/固件及编译日志/<版本号>/release-notes.md(便于在源码仓一处查齐本轮结论)
        echo "release_tag=${BUILD_VERSION_FINAL}" >> $GITHUB_OUTPUT
        NOTES="${RELEASE_NOTES}"
        {
          echo "# ${BUILD_VERSION_FINAL}"
          echo ""
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| 固件版本 | ${BUILD_VERSION_FINAL} |"
          echo "| 源码提交 | ${SOURCE_COMMIT} |"
          echo "| 构建时间 | $(date +%FT%T%z) |"
          echo "| 构建记录 | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          if [ -n "${RUN_LABEL}" ]; then
            echo "| 运行显示名 | ${RUN_LABEL} |"
          fi
          echo ""
          echo "## 资产说明"
          echo ""
          echo "| 资产 | 用途 |"
          echo "|---|---|"
          echo "| *squashfs-sysupgrade.itb | 整机刷写用的主固件, 保留配置升级 |"
          echo "| *initramfs-recovery.itb | 内存运行固件, 用于救砖与不写 flash 的验证 |"
          echo "| *bl31-uboot.fip / *preloader.bin / *-ram-comb-bl2.bin | bootloader 三段, 只在需要重刷引导时使用 |"
          echo "| *.manifest / sha256sums / profiles.json | 包清单、校验和、设备描述 |"
          echo "| mt7988d-tplink-tl-7dr7230-v2.dtb | 本机设备树, 供反编译核对节点 |"
          echo "| packages.tar.zst | 本轮全部 ipk 包内容, 供定层排查与单独装包 |"
          echo "| firmware-bundle.tar.zst | 上面这些单文件的整包归档, 便于一次下载全部 |"
          echo "| build-dir.tar.zst.part* | 编译现场(内核源码、驱动源码、全套 .o/.ko/.o.cmd、staging 与工具链), 分卷 |"
          echo "| build-info.txt | 补丁应用统计与产物体积 |"
          echo "| release-notes.md | 本文件 |"
          echo ""
          echo "## 编译现场分卷还原"
          echo ""
          echo '```'
          echo "cat build-dir.tar.zst.part* | zstd -d | tar -xf - -C <目标目录>"
          echo '```'
          echo ""
          echo "还原后目录结构为 <目标目录>/build_dir/... 与 <目标目录>/staging_dir/..."
          echo ""
          echo "## 验收数字(本轮自动统计)"
          echo ""
          echo '```'
          cat /workdir/mt-wifi7-migration-check.txt 2>/dev/null || echo "(迁移检查文件缺失)"
          echo ""
          cat /workdir/build-info.txt 2>/dev/null || echo "(构建信息文件缺失)"
          echo '```'
        } > "$NOTES"
        wc -l "$NOTES"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload release notes to source repository
      if: steps.notes.outputs.status == 'success' && env.UPLOAD_RELEASE_NOTES_TO_SOURCE == 'true' && !cancelled()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      run: |
        # 把发版说明回写到私有源码仓库的 tmp/固件及编译日志/<版本号>/release-notes.md,
        # 使"本轮固件的全部结论"在源码仓一处可查. 用 GitHub contents API 单文件写入, 不 clone 仓库.
        # 写入目标是本次检出的分支(SOURCE_REF), 不是 main.
        NOTES="${RELEASE_NOTES}"
        DEST="tmp/固件及编译日志/${BUILD_VERSION_FINAL}/release-notes.md"
        if [ ! -f "$NOTES" ]; then
          echo "发版说明文件不存在, 跳过回写"
          exit 0
        fi
        # 路径含中文, 交给 curl 前先做一次 URL 编码
        enc_path=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$DEST")
        content_b64=$(base64 -w0 "$NOTES")
        # 先查该路径是否已存在, 拿到 blob sha 才能更新而不是新建
        sha=""
        resp=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${SOURCE_REPO}/contents/${enc_path}?ref=${SOURCE_REF}" || true)
        if [ -n "$resp" ]; then
          sha=$(printf '%s' "$resp" | python3 - <<'PYEOF'
        import json, sys
        try:
            data = json.loads(sys.stdin.read())
            print(data.get("sha", ""))
        except Exception:
            print("")
        PYEOF
        )
        fi
        payload=$(python3 - "$enc_path" "$content_b64" "$sha" "$BUILD_VERSION_FINAL" <<'PYEOF'
        import json, sys
        path, b64, sha, msg = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
        body = {"message": f"docs(固件日志): 回写 {msg} 的发版说明", "content": b64}
        if sha:
            body["sha"] = sha
        print(json.dumps(body))
        PYEOF
        )
        code=$(curl -sS -o /tmp/put-resp.json -w '%{http_code}' -X PUT \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "https://api.github.com/repos/${SOURCE_REPO}/contents/${enc_path}")
        echo "contents API 返回码 = ${code}"
        head -c 400 /tmp/put-resp.json 2>/dev/null || true
        echo

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.notes.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.notes.outputs.release_tag }}
        body_path: ${{ env.RELEASE_NOTES }}
        files: ${{ env.FIRMWARE }}/*
    # 运行记录与 Release 不主动清理(用户已决定: Release 全部保留;运行记录由平台 90 天保留期自然过期)
